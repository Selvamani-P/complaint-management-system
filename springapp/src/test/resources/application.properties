# Spring Boot Test Configuration
spring.application.name=complaint-management-backend-test

# In-Memory H2 Database for Hermetic Testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Test JWT Secret (at least 32 characters)
jwt.secret=ThisIsATestSecretKeyForUnitTestingPurposesOnly1234567890
jwt.expiration=86400000

# Error Response Config
server.error.include-message=always
server.error.include-binding-errors=always
